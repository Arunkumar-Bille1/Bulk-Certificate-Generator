version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: cert_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cert_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/certificate_db
      DEBUG: "false"
      CERTIFICATES_DIR: /app/certificates
      MAX_RECIPIENTS_PER_JOB: 500
    ports:
      - "8000:8000"
    volumes:
      # Mount certificates directory so PDFs persist across container restarts
      - cert_files:/app/certificates
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  cert_files:
